name: Documentation quality and GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Check Markdown, links, style, and Python fences
        run: python tools/check_docs.py
      - name: Install MkDocs
        run: python -m pip install -r requirements-docs.txt
      - name: Prepare MkDocs sources
        run: python tools/prepare_mkdocs.py
      - name: Build documentation site
        run: mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: [documentation, example-tests, distributed-example]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  example-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic-crud, production-api, ai-api]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install example
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q app
      - name: Test
        run: pytest

  distributed-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/distributed-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q app
