services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_api}
      POSTGRES_USER: ${POSTGRES_USER:-ai_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ai_api_postgres:/var/lib/postgresql/data

  migrate:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s

volumes:
  ai_api_postgres:
