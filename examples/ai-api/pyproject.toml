[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-ai-api-example"
version = "0.1.0"
description = "FastAPI reference with SSE generation and durable PostgreSQL jobs"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.141.1,<1",
    "openai>=2,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.42,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "aiosqlite>=0.21,<1",
    "httpx2>=2.10,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
